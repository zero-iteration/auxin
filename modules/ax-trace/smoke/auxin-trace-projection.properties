# Per-service enrichment: type -> whitelisted no-arg getters.
#
# getPassengerEmail is listed ON PURPOSE. It is refused at config load by the redaction
# denylist (normalised "passengeremail" contains "email"), the refusal is logged naming the
# type and the getter, and run-trace-smoke.sh asserts that no e-mail address and no
# passenger name appears anywhere in any trace document.
traceapp.Fare = getCarrier, getStops, isRefundable, getPassengerEmail
