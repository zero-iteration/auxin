[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ax-server"
version = "0.2.0"
description = "auxin server side: store, collector, analysis, api, mcp"
# BUG #27: this said ">=3.14", which blocks `pip install` on essentially every
# current box -- 3.14 shipped weeks ago and no LTS distro or CI image has it.
# Nothing here needs it: the newest language features in use are `X | None`
# (3.10), `datetime.UTC` / `enum.StrEnum` (3.11) and `int.bit_count` (3.10).
# `tests/test_python_compat.py` enforces the floor instead of trusting it.
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Strict: a real warning from our own code must fail the suite. ResourceWarning
# is ignored only because ThreadingHTTPServer/urllib leave per-connection
# sockets for the GC to close, which is test-harness noise, not our leak.
filterwarnings = ["error", "ignore::ResourceWarning"]
