# =============================================================================
# RBAC for the Warning Events generated by ax-events-policy.yaml
# =============================================================================
# Kyverno's background controller runs with a least-privilege ClusterRole and can only
# create the resource kinds it has been granted. Event creation in arbitrary namespaces is
# not granted by default, so without this the `generate` rules fail silently in the
# background controller log and the operator sees no warning at all.
#
# Kyverno aggregates any ClusterRole carrying the label below into its background
# controller role (Kyverno >= 1.10). Verify the label key for your version:
#   kubectl get clusterrole kyverno:background-controller -o yaml | grep -A5 aggregationRule
#
# >>> NOT APPLIED. No cluster on the build host.
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:auxin-events
  labels:
    app.kubernetes.io/part-of: auxin
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - update
      - patch
      - get
      - list
      - watch
      - delete
